<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greek Warriors: The Lost Medallion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#87CEEB; --med:#2878B5; --turq:#48C9B0; --gold:#FFD166;
  --beige:#F5E6C8; --cream:#FFF9EC; --olive:#9BBF75; --coral:#FF956B;
  --ink:#355070; --ink2:#5b6b85; --ok:#5fb37a; --no:#e06a4b;
  --terra:#C96E4A; --sand:#E8D5A8; --marble:#F3EEE2; --wine:#7d2b3e;
  --head:'Fredoka',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
  --shadow:0 10px 0 rgba(40,120,181,.18),0 16px 30px rgba(40,120,181,.22);
}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#9fdcf0 0%,var(--sky) 40%,#aee3d6 100%);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:var(--head);font-weight:600;color:var(--med);line-height:1.1}
button{font-family:var(--body);cursor:pointer}
::selection{background:var(--gold)}

#app{min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:22px 18px 46px}
.center{text-align:center}
.hidden{display:none!important}

/* clouds decoration */
.clouds{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.75;filter:blur(1px)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.c1{width:120px;height:34px;top:8%;left:-140px;animation:drift 46s linear infinite}
.c2{width:90px;height:26px;top:22%;left:-120px;animation:drift 60s linear infinite;animation-delay:-20s}
.c3{width:150px;height:40px;top:5%;left:-180px;animation:drift 72s linear infinite;animation-delay:-40s}
.cloud::before{width:50%;height:160%;top:-50%;left:14%}
.cloud::after{width:38%;height:150%;top:-46%;right:16%}
@keyframes drift{to{transform:translateX(130vw)}}
#app,.topbar{position:relative;z-index:1}
/* ===== GREEK-THEMED BACKGROUND ===== */
.greekbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.greekbg .gsun{position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#fff3cf 0%,#ffe79b55 45%,transparent 70%)}
.meander{position:absolute;left:0;right:0;height:38px;opacity:.28;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Cpath%20d='M0,6H40M8,6V30H32V16H18V23'%20fill='none'%20stroke='%23C96E4A'%20stroke-width='4'/%3E%3C/svg%3E");background-size:40px 38px;background-repeat:repeat-x}
.meander-top{top:0}
.meander-bottom{bottom:0;transform:scaleY(-1)}
.g-col{position:absolute;bottom:34px;top:48px;width:84px;opacity:.16}
.g-col svg{width:100%;height:100%;display:block}
.g-col.l{left:1.5%}.g-col.r{right:1.5%}
.g-temple{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:min(760px,88vw);opacity:.12}
.g-temple svg{width:100%;height:auto;display:block}
.g-urn{position:absolute;width:70px;opacity:.14}
.g-urn svg{width:100%;height:auto}
.g-urn.u1{bottom:60px;left:11%}
.g-urn.u2{bottom:70px;right:11%;transform:scaleX(-1)}
@media(max-width:720px){.g-col,.g-urn{display:none}.g-temple{opacity:.1}}

/* ===== buttons ===== */
.btn{font-family:var(--head);font-size:1.15rem;font-weight:600;border:none;border-radius:50px;
  padding:15px 34px;color:#fff;background:linear-gradient(180deg,#ffb84d,var(--coral));
  box-shadow:0 6px 0 #d96a44,0 12px 20px rgba(255,149,107,.4);transition:.12s;letter-spacing:.3px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #d96a44,0 16px 26px rgba(255,149,107,.5)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d96a44}
.btn.blue{background:linear-gradient(180deg,#4a9fe0,var(--med));box-shadow:0 6px 0 #1b5a8e,0 12px 20px rgba(40,120,181,.4)}
.btn.blue:hover{box-shadow:0 8px 0 #1b5a8e,0 16px 26px rgba(40,120,181,.5)}
.btn.blue:active{box-shadow:0 2px 0 #1b5a8e}
.btn.green{background:linear-gradient(180deg,#b6d98f,var(--olive));box-shadow:0 6px 0 #6f9150}
.btn.green:active{box-shadow:0 2px 0 #6f9150}
.btn.gold{background:linear-gradient(180deg,#ffe08a,var(--gold));color:#8a6a1f;box-shadow:0 6px 0 #d1a53a}
.btn.gold:active{box-shadow:0 2px 0 #d1a53a}
.btn.sm{font-size:.95rem;padding:10px 20px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn.sm:active{box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{filter:grayscale(.5) opacity(.6);cursor:not-allowed}
.btnrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:26px}
/* ===== topbar ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px 18px;background:#fff9ecd9;backdrop-filter:blur(6px);border-bottom:4px solid var(--gold);
  position:sticky;top:0;z-index:40}
.topbar .brand{font-family:var(--head);color:var(--med);font-size:1.05rem}
.topbar .brand small{display:block;font-size:.72rem;color:var(--coral);font-weight:700}
.tbright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scorechip{font-family:var(--head);background:var(--gold);color:#8a6a1f;padding:6px 14px;border-radius:30px;font-size:.95rem;box-shadow:0 3px 0 #d1a53a}
.meds{display:flex;gap:4px}
.meds .m{width:26px;height:26px;opacity:.28;filter:grayscale(1)}
.meds .m.on{opacity:1;filter:none;animation:bounce .6s}
@keyframes bounce{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ===== panels ===== */
.panel{background:var(--cream);border:4px solid #fff;border-radius:28px;padding:24px 26px;box-shadow:var(--shadow)}
.panel.beige{background:var(--beige)}
.bubblecard{background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 6px 0 rgba(40,120,181,.12)}
.sectitle{text-align:center;margin-bottom:10px}
.sectitle .eyebrow{display:inline-block;background:var(--turq);color:#fff;font-family:var(--head);
  padding:5px 16px;border-radius:30px;font-size:.82rem;letter-spacing:.5px;box-shadow:0 3px 0 #2f9c86}
.sectitle h2{font-size:clamp(1.5rem,4.5vw,2.4rem);margin-top:10px}
.lead{max-width:720px;margin:6px auto 0;text-align:center;color:var(--ink2);font-weight:600;font-size:1.05rem}

/* ===== Alexios guide ===== */
.guide{display:flex;align-items:flex-end;gap:14px;margin:4px 0 18px}
.guide .ava{width:96px;flex:none;filter:drop-shadow(0 6px 6px rgba(40,120,181,.25))}
.guide .ava svg{width:100%;height:auto;display:block}
.speech{position:relative;background:#fff;border:3px solid var(--gold);border-radius:20px;padding:14px 18px;
  font-weight:700;color:var(--ink);font-size:1.05rem;box-shadow:0 5px 0 rgba(255,209,102,.5);flex:1}
.speech::after{content:'';position:absolute;left:-14px;bottom:18px;border:8px solid transparent;border-right-color:var(--gold)}
.speech::before{content:'';position:absolute;left:-9px;bottom:18px;border:8px solid transparent;border-right-color:#fff;z-index:1}
@media(max-width:560px){.guide{flex-direction:column;align-items:center}.guide .ava{width:120px}.speech::after,.speech::before{display:none}}

/* ===== opening ===== */
#opening{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.open-scene{position:relative;z-index:2;max-width:860px;padding:30px 20px}
.titlecard{background:#fff9ecee;border:5px solid var(--gold);border-radius:34px;padding:26px 30px;box-shadow:var(--shadow);display:inline-block}
.gametitle{font-size:clamp(2rem,7vw,4rem);color:var(--coral);text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(40,120,181,.18);letter-spacing:1px;line-height:1}
.gametitle .l2{color:var(--med);display:block}
.subtitle{font-family:var(--head);color:var(--turq);font-size:clamp(1rem,3vw,1.5rem);margin-top:8px}
.open-hero{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.open-hero .alx{width:150px}.open-hero .ship{width:230px}
.open-hero svg{width:100%;height:auto;display:block}
.storybox{background:#fff;border-radius:22px;padding:16px 20px;max-width:620px;margin:16px auto 0;
  font-weight:700;color:var(--ink);box-shadow:0 6px 0 rgba(40,120,181,.12);font-size:1.05rem}
.waves{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:1}
/* ===== map ===== */
.mapstage{position:relative;border:5px solid #fff;border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.mapstage svg{display:block;width:100%;height:auto}
.cp-hit{cursor:pointer}
.cp-hit.lock{cursor:not-allowed}
.progwrap{display:flex;align-items:center;gap:12px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.progbar{flex:1;max-width:420px;height:18px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--gold));transition:width .6s}
.progtxt{font-family:var(--head);color:var(--med)}
.maphint{text-align:center;margin-top:12px;font-weight:700;color:var(--ink2)}

/* ===== mission banner ===== */
.mbanner{border-radius:24px;overflow:hidden;position:relative;margin-bottom:18px;box-shadow:var(--shadow);border:4px solid #fff}
.mbanner svg{display:block;width:100%;height:auto}
.mbanner .tag{position:absolute;top:14px;left:14px;background:var(--coral);color:#fff;font-family:var(--head);padding:6px 16px;border-radius:30px;box-shadow:0 3px 0 #d96a44}

/* ===== quiz ===== */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-family:var(--head);color:var(--med);margin-bottom:8px}
.qbar{height:14px;background:#fff;border-radius:20px;overflow:hidden;margin-bottom:20px;box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--gold));transition:width .4s}
.qcard{background:#fff;border-radius:24px;padding:22px 24px;box-shadow:0 8px 0 rgba(40,120,181,.12)}
.picbox{background:linear-gradient(180deg,#dff2fb,#c7e8f6);border-radius:20px;padding:16px;display:grid;place-items:center;margin-bottom:16px}
.picbox svg{width:100%;max-width:230px;height:170px}
.qtext{font-family:var(--head);font-size:1.3rem;color:var(--ink);margin-bottom:16px;line-height:1.25}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border:3px solid #e3eaf2;border-radius:18px;
  background:#fff;color:var(--ink);font-weight:700;font-size:1.08rem;transition:.12s;width:100%}
.opt:hover:not(.lock){border-color:var(--turq);background:#f0fbf8;transform:translateY(-2px)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sky);color:#fff;font-family:var(--head);display:grid;place-items:center;font-size:1.05rem}
.opt.lock{cursor:default}
.opt.correct{border-color:var(--ok);background:#eafaef}.opt.correct .k{background:var(--ok)}
.opt.wrong{border-color:var(--no);background:#fdeee9}.opt.wrong .k{background:var(--no)}
.opts.grid2{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.grid2{grid-template-columns:1fr}}
/* feedback bubble (Alexios) */
.fb{margin-top:18px;border-radius:20px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;animation:pop .35s both}
.fb .ava{width:64px;flex:none}.fb .ava svg{width:100%}
.fb.ok{background:#eafaef;border:3px solid var(--ok)}
.fb.no{background:#fdeee9;border:3px solid var(--no)}
.fb h4{font-family:var(--head);font-size:1.15rem;margin-bottom:4px}
.fb.ok h4{color:#3f8f58}.fb.no h4{color:#c2503a}
.fb .why{margin-top:6px;font-size:.95rem;color:var(--ink2)}
.fb .why b{color:var(--med)}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center}

/* ===== vocab / info cards ===== */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:8px}
.vcard{background:#fff;border:4px solid var(--gold);border-radius:22px;overflow:hidden;box-shadow:0 8px 0 rgba(255,209,102,.4);transition:.15s;cursor:pointer}
.vcard:hover{transform:translateY(-4px)}
.vcard .pic{background:linear-gradient(180deg,#dff2fb,#c7e8f6);display:grid;place-items:center;padding:16px}
.vcard .pic svg{width:100%;max-width:120px;height:120px}
.vcard .body{padding:14px 16px}
.vcard .nm{font-family:var(--head);color:var(--coral);font-size:1.3rem}
.vcard .gk{font-size:.8rem;color:var(--turq);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.vcard .desc{font-weight:600;color:var(--ink2);font-size:.96rem}
.vcard .seen{display:inline-block;margin-top:8px;color:var(--ok);font-weight:800;font-size:.85rem;opacity:0}
.vcard.seen-on .seen{opacity:1}

/* ===== matching ===== */
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:8px}
@media(max-width:620px){.match-wrap{grid-template-columns:1fr}}
.mcol h3{font-family:var(--head);color:var(--med);text-align:center;margin-bottom:10px}
.tile{padding:14px 16px;border:3px solid var(--turq);border-radius:18px;background:#fff;font-weight:800;color:var(--ink);
  margin-bottom:12px;text-align:center;transition:.12s;box-shadow:0 5px 0 rgba(72,201,176,.35)}
.tile.pick{background:var(--turq);color:#fff;transform:translateY(-2px)}
.tile.done{opacity:.45;pointer-events:none;border-color:var(--ok);box-shadow:none}
.dslot{padding:14px 16px;border:3px dashed #bcd6c9;border-radius:18px;background:#fff;font-weight:700;color:var(--ink2);margin-bottom:12px;transition:.12s}
.dslot.pick{border-color:var(--coral);background:#fff6f1}
.dslot.done{border-style:solid;border-color:var(--ok);background:#eafaef;color:var(--ink)}
.dslot .tag{display:inline-block;margin-top:6px;background:var(--ok);color:#fff;font-family:var(--head);padding:3px 12px;border-radius:20px;font-size:.9rem}

/* ===== phalanx puzzle ===== */
.pzrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slotbox{width:52px;height:60px;border:3px dashed #bcd6c9;border-radius:12px;background:#fff;display:grid;place-items:center;transition:.15s}
.slotbox.full{border-style:solid;border-color:var(--olive);background:#f1f7e9}
.slotbox svg{width:42px;height:50px}
.tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.troop{width:52px;height:60px;border:none;background:transparent;transition:.12s}
.troop svg{width:100%;height:100%}
.troop:hover{transform:translateY(-3px) scale(1.05)}
.troop.used{opacity:.25;pointer-events:none}
/* ===== click-hotspot activity (defensive positions) ===== */
.hotstage{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 8px 0 rgba(40,120,181,.12);border:4px solid #fff}
.hotstage svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hotlist{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hotlist .hl{background:#fff;border:3px solid #e3eaf2;border-radius:30px;padding:8px 16px;font-weight:800;color:var(--ink2)}
.hotlist .hl.on{border-color:var(--ok);background:#eafaef;color:#3f8f58}
.hotlist .hl.on::before{content:'\2605 '}

/* ===== sorting bins (weapon discovery) ===== */
.sorttray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.sortitem{width:110px;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:8px;text-align:center;transition:.12s;box-shadow:0 5px 0 rgba(255,209,102,.4)}
.sortitem svg{width:70px;height:64px}
.sortitem .nm{font-family:var(--head);color:var(--coral);font-size:.95rem}
.sortitem.pick{background:var(--gold);transform:translateY(-3px)}
.sortitem.used{opacity:.3;pointer-events:none}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:620px){.bins{grid-template-columns:1fr}}
.bin{min-height:130px;border:3px dashed #9cc;border-radius:20px;background:#fff;padding:12px;text-align:center;transition:.12s}
.bin.pick{border-color:var(--coral);background:#fff6f1}
.bin h3{font-family:var(--head);font-size:1rem;margin-bottom:8px}
.bin .drop{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.bin .drop .ch{background:var(--turq);color:#fff;font-weight:800;padding:4px 10px;border-radius:14px;font-size:.82rem}

/* ===== journal ===== */
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:8px}
.jcard{background:#fff;border:4px solid #fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 rgba(40,120,181,.12);cursor:pointer;transition:.15s;position:relative}
.jcard:hover{transform:translateY(-4px)}
.jcard.locked{filter:grayscale(.85) opacity(.55)}
.jcard .pic{background:linear-gradient(180deg,#dff2fb,#c7e8f6);display:grid;place-items:center;padding:14px}
.jcard .pic svg{width:92px;height:92px}
.jcard .nm{font-family:var(--head);color:var(--med);text-align:center;padding:10px 8px;font-size:1.05rem}
.jcard .lk{position:absolute;top:8px;right:10px;font-size:1.2rem}

/* ===== results ===== */
.resultwrap{max-width:640px;margin:0 auto;text-align:center}
.resulthero{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-bottom:6px}
.resulthero .alx{width:150px}.resulthero svg{width:100%;height:auto}
.scorebig{font-family:var(--head);font-size:3rem;color:var(--coral);line-height:1}
.scorebig small{font-size:1.1rem;color:var(--ink2)}
.rankbox{background:linear-gradient(180deg,#ffe08a,var(--gold));border-radius:24px;padding:18px;margin:16px 0;box-shadow:0 8px 0 #d1a53a}
.rankbox .rk{font-family:var(--head);font-size:2rem;color:#8a6a1f}
.medtray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.medtray .m{width:60px}.medtray .m.off{opacity:.25;filter:grayscale(1)}
.reflect{background:#fff;border-radius:20px;padding:16px 18px;text-align:left;font-weight:700;color:var(--ink);box-shadow:0 6px 0 rgba(40,120,181,.12);margin:14px 0}
.stars{font-size:1.8rem;letter-spacing:.2em;color:var(--gold)}
.stars .off{color:#dfe7ef}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:120;
  background:#fff;border:3px solid var(--gold);color:var(--med);font-family:var(--head);padding:12px 22px;border-radius:30px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.35s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.conf i{position:absolute;top:-20px;width:11px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

/* medallion popup */
.pop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(40,80,112,.5);backdrop-filter:blur(3px)}
.pop.on{display:flex;animation:pop .3s both}
.pop .box{background:var(--cream);border:5px solid var(--gold);border-radius:30px;padding:26px 28px;max-width:440px;text-align:center;box-shadow:var(--shadow);position:relative;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.pop .box .medimg{width:140px;margin:0 auto 6px;animation:spin 1s ease}
@keyframes spin{from{transform:rotateY(-540deg) scale(.4)}to{transform:none}}
.pop .x{position:absolute;top:10px;right:16px;font-size:1.8rem;border:none;background:none;color:var(--ink2);cursor:pointer}
/* ===== OVERRIDE / COMPLETE STYLES ===== */
html,body{margin:0;min-height:100%;font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,#bfe9ff 0%,#e9f7ff 40%,var(--cream) 100%);background-attachment:fixed}
*{box-sizing:border-box}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.75;filter:blur(1px)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:120px;height:34px;top:8%;left:-140px;animation:drift 38s linear infinite}
.cloud.c2{width:90px;height:26px;top:22%;left:-140px;animation:drift 50s linear infinite;animation-delay:-10s}
.cloud.c3{width:150px;height:40px;top:5%;left:-180px;animation:drift 62s linear infinite;animation-delay:-25s}
.cloud::before{width:50%;height:160%;top:-50%;left:12%}
.cloud::after{width:40%;height:150%;top:-40%;right:14%}
@keyframes drift{to{left:110%}}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 14px 40px}
.screen{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
/* topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:3px solid #fff;box-shadow:0 6px 18px rgba(40,120,181,.18);border-radius:0 0 20px 20px;padding:10px 16px;margin:0 -14px 18px}
.tbtn{font-family:var(--head);font-size:1rem;background:var(--turq);color:#fff;border:none;border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 #2fa894}
.tbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #2fa894}
.topbar .sc{font-family:var(--head);background:var(--gold);color:#7a5b12;padding:6px 14px;border-radius:14px;font-size:1.05rem}
.topbar .sc b{font-size:1.3rem}
.sclbl{font-family:var(--body);font-weight:700;font-size:.72rem;opacity:.8;display:block;line-height:1}
.topbar .med{display:flex;align-items:center;gap:6px;margin-left:auto}
#medWrap{display:flex;gap:4px}
.medchip{font-size:1.2rem;filter:grayscale(1);opacity:.45;transition:.3s}
.medchip.on{filter:none;opacity:1;transform:scale(1.15)}
/* buttons */
.btn{font-family:var(--head);font-size:1.1rem;background:var(--med);color:#fff;border:none;border-radius:16px;padding:12px 22px;cursor:pointer;box-shadow:0 5px 0 #1f5d90;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1f5d90}
.btn:disabled{background:#b9c6d6;box-shadow:0 5px 0 #96a6ba;cursor:not-allowed}
.btn.big{font-size:1.4rem;padding:16px 34px;border-radius:22px}
.btn.ghost{background:var(--turq);box-shadow:0 5px 0 #2fa894}
.btn.ghost:active{box-shadow:0 2px 0 #2fa894}
.btn.warn{background:var(--coral);box-shadow:0 5px 0 #d96a44}
.btn.warn:active{box-shadow:0 2px 0 #d96a44}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
/* guide / speech */
.guide{display:flex;align-items:flex-start;gap:14px;background:#fff;border:3px solid var(--sky);border-radius:22px;padding:14px 16px;box-shadow:0 8px 22px rgba(40,120,181,.14);margin:0 0 18px}
.guide .gav{flex:0 0 96px;width:96px}
.guide .gav svg{width:100%;height:auto;display:block}
.guide.sm .gav{flex-basis:70px;width:70px}
.guide .bubble{position:relative;background:var(--cream);border:2px dashed var(--turq);border-radius:18px;padding:12px 16px;font-size:1.05rem;line-height:1.5;flex:1}
.guide .bubble.big{font-size:1.15rem}
.guide .bubble b{color:var(--med)}
/* opening */
.opening{text-align:center;padding-top:20px}
.open-hero{position:relative;background:linear-gradient(180deg,#fffdf7,var(--marble));border:5px solid #fff;border-radius:30px;box-shadow:0 16px 46px rgba(40,120,181,.24);padding:30px 24px 32px;max-width:660px;margin:0 auto;overflow:hidden}
.open-hero::before,.open-hero::after{content:'';position:absolute;left:0;right:0;height:22px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Cpath%20d='M0,6H40M8,6V30H32V16H18V23'%20fill='none'%20stroke='%23C96E4A'%20stroke-width='4'/%3E%3C/svg%3E");background-size:30px 22px;background-repeat:repeat-x;opacity:.55}
.open-hero::before{top:0}
.open-hero::after{bottom:0;transform:scaleY(-1)}
.open-ship{width:230px;margin:0 auto -6px;animation:bob 3s ease-in-out infinite}
.open-ship svg{width:100%;height:auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.title{font-family:var(--head);font-size:3rem;margin:.1em 0 0;color:var(--med);letter-spacing:1px;text-shadow:3px 3px 0 var(--gold)}
.subt{font-family:var(--head);font-size:1.5rem;margin:.1em 0 .5em;color:var(--coral)}
.alx-big{width:170px;margin:4px auto 10px}
.alx-big svg{width:100%;height:auto}
.bubble.big{display:inline-block;background:var(--cream);border:2px dashed var(--turq);border-radius:20px;padding:14px 18px;font-size:1.08rem;line-height:1.55;max-width:540px;margin-bottom:18px}
.bubble.big b{color:var(--med)}
.hint{font-size:.9rem;color:var(--ink2);margin-top:14px}
.era{display:inline-block;font-family:var(--head);color:var(--wine);background:#fff;border:2px solid var(--terra);border-radius:999px;padding:4px 14px;font-size:.82rem;margin:2px 0 6px;letter-spacing:.5px}
.histfact{text-align:left;background:linear-gradient(180deg,#fff,var(--sand));border:3px solid var(--terra);border-radius:18px;padding:14px 16px 14px 54px;position:relative;max-width:560px;margin:14px auto 0}
.histfact::before{content:'🏛️';position:absolute;left:14px;top:12px;font-size:1.7rem}
.histfact .hf-t{font-family:var(--head);color:var(--wine);font-size:.95rem;margin-bottom:3px}
.histfact p{font-size:.95rem;line-height:1.5;color:var(--ink);margin:0}
.histfact b{color:var(--terra)}
/* mission header */
.misshd{text-align:center;margin:6px 0 16px}
.misstag{display:inline-block;font-family:var(--head);background:var(--turq);color:#fff;padding:5px 16px;border-radius:30px;font-size:.95rem;box-shadow:0 4px 0 #2fa894}
.misstag.gold{background:var(--gold);color:#7a5b12;box-shadow:0 4px 0 #d1a53a}
.misstitle{font-family:var(--head);font-size:2rem;color:var(--med);margin:.3em 0}
.stagebox{background:#fff;border:3px solid #fff;border-radius:26px;box-shadow:0 12px 34px rgba(40,120,181,.16);padding:22px}
.intro{text-align:center}
.stginfo{font-size:1.05rem;line-height:1.5;background:var(--cream);border-radius:16px;padding:12px 16px;margin:0 0 16px}
.stginfo b{color:var(--med)}
.infogrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.infogrid.g4 .infobox{flex-basis:160px}
.infobox{flex:1 1 160px;max-width:200px;background:var(--cream);border:2px solid var(--sky);border-radius:18px;padding:14px;text-align:center}
.infobox svg{width:84px;height:84px}
.infobox p{margin:6px 0 0;font-weight:700;font-size:.95rem}
.terr{height:60px;border-radius:12px;margin-bottom:4px}
.terr.flat{background:linear-gradient(180deg,#cfe8a3,#9BBF75)}
.terr.hill{background:linear-gradient(180deg,#9BBF75,#7fa557);clip-path:polygon(0 100%,15% 55%,32% 80%,50% 35%,68% 70%,85% 45%,100% 100%)}
.terr.narrow{background:linear-gradient(90deg,#9aa0a6 0 32%,#9fe0d6 32% 68%,#9aa0a6 68% 100%)}
/* map */
.mapwrap{text-align:center}
.maphd{text-align:left}
.progbar{position:relative;height:26px;background:#fff;border:3px solid var(--sky);border-radius:20px;overflow:hidden;margin:0 0 14px;box-shadow:inset 0 2px 6px rgba(0,0,0,.08)}
.progfill{height:100%;background:linear-gradient(90deg,var(--turq),var(--gold));transition:width .6s ease;border-radius:20px}
.proglbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:.9rem;color:#355070}
.mapsvg{background:#fff;border:3px solid #fff;border-radius:24px;box-shadow:0 12px 30px rgba(40,120,181,.16);padding:8px;overflow:hidden}
.mapsvg svg{width:100%;height:auto;display:block}
.pin{transition:transform .2s}
.pin .pinbg{fill:#fff;stroke:#2878B5;stroke-width:4}
.pin .pinring{fill:none;stroke:#FFD166;stroke-width:3;stroke-dasharray:3 5}
.pin .pinnum{font-family:var(--head);font-size:26px;fill:var(--med);text-anchor:middle;font-weight:700}
.pin.open .pinbg{fill:#fff}
.pin.open{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pin.done .pinbg{fill:#FFF3C6;stroke:#FFD166}
.pin.done .pinring{stroke:#5fb37a}
.pin.lock .pinbg{fill:#dbe3ec;stroke:#9fb0c2}
.pin.lock .pinnum{fill:#8296ab;font-size:20px}
#shipM{transition:transform 1s ease}
.maplegend{margin-top:12px;font-family:var(--head);font-size:.95rem;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.maplegend a{color:var(--med);cursor:pointer;text-decoration:underline}
/* quiz */
.qcard{}
.qprog{font-family:var(--head);color:var(--turq);font-size:1rem;margin-bottom:8px}
.qimg{text-align:center;margin:0 0 10px}
.qimg svg{width:120px;height:120px;background:var(--cream);border-radius:18px;padding:8px;border:2px solid var(--sky)}
.qtext{font-family:var(--head);font-size:1.3rem;line-height:1.35;margin:0 0 14px;color:var(--ink)}
.qtext b{color:var(--med)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font-family:var(--body);font-weight:700;font-size:1.08rem;text-align:left;background:#fff;border:3px solid var(--sky);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.15s}
.opt:hover{background:var(--cream);transform:translateX(3px)}
.opt.right{background:#e3f6e9;border-color:var(--ok);color:#2d7a4b}
.opt.wrong{background:#fde6df;border-color:var(--no);color:#b44}
.opt.locked{cursor:default}
.opt.locked:hover{transform:none}
.qnav{margin-top:16px;text-align:right}
.qfb{margin-top:14px}
.fb{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;font-size:1rem;line-height:1.45;animation:fade .3s}
.fb svg{width:60px;height:60px;flex:0 0 60px}
.fb.good{background:#e3f6e9;border:2px solid var(--ok)}
.fb.bad{background:#fff3e6;border:2px solid var(--coral)}
.fb b{color:var(--med)}
/* activity shared */
.activity h3{font-family:var(--head);font-size:1.4rem;color:var(--med);margin:0 0 8px;text-align:center}
.hsfb{text-align:center;font-size:1.05rem;margin:14px 0 4px;min-height:24px}
.hsfb b{color:var(--med)}
.ok{color:#2d7a4b;font-weight:800}
.no{color:var(--no);font-weight:800}
/* hotspot */
.scene{position:relative;max-width:460px;margin:0 auto;border-radius:18px;overflow:hidden;border:3px solid var(--sky)}
.scene .scenebg{display:block;width:100%;height:auto}
.spotlayer{position:absolute;inset:0;width:100%;height:100%}
.spot{cursor:pointer}
.spot .spotc{fill:#fff;opacity:.55;stroke:var(--med);stroke-width:3;stroke-dasharray:4 4}
.spot text{text-anchor:middle;font-family:var(--head);font-size:24px;fill:var(--med)}
.spot:hover .spotc{opacity:.8}
.spot.sel .spotc{fill:var(--gold);opacity:.95;stroke:#d1a53a}
.spot.good .spotc{fill:#5fb37a;opacity:.95;stroke:#2d7a4b;stroke-dasharray:none}
.spot.good text{fill:#fff}
.spot.bad .spotc{fill:var(--no);opacity:.9}
.spot.bad text{fill:#fff}
/* sort */
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.item{font-family:var(--head);font-size:1.05rem;background:var(--cream);border:3px solid var(--gold);border-radius:14px;padding:10px 16px;cursor:pointer}
.item.active{background:var(--gold);transform:scale(1.05)}
.item.used{opacity:.3}
.bins{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bin{flex:1 1 150px;max-width:220px;background:#f3f8ff;border:3px dashed var(--med);border-radius:18px;padding:10px;cursor:pointer;min-height:120px}
.bin:hover{background:#e7f1ff}
.binhd{font-family:var(--head);text-align:center;color:var(--med);margin-bottom:8px;font-size:1.05rem}
.bindrop{display:flex;flex-direction:column;gap:6px}
.chip{font-family:var(--head);background:var(--turq);color:#fff;border:none;border-radius:12px;padding:8px;cursor:pointer}
/* vocab */
.vcards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.vcard{width:150px;height:170px;perspective:800px;cursor:pointer}
.vinner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.vcard.flip .vinner{transform:rotateY(180deg)}
.vfront,.vback{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center}
.vfront{background:var(--cream);border:3px solid var(--turq)}
.vfront svg{width:70px;height:70px}
.vfront b{font-family:var(--head);color:var(--med);font-size:1.2rem;margin-top:4px}
.vtap{font-size:.75rem;color:var(--ink2);margin-top:6px}
.vback{background:var(--med);color:#fff;transform:rotateY(180deg);font-size:.98rem;line-height:1.4;font-weight:700}
/* match */
.matchwrap{display:flex;gap:16px;justify-content:center}
.mcol{display:flex;flex-direction:column;gap:10px;flex:1;max-width:260px}
.mitem{font-family:var(--body);font-weight:700;font-size:1rem;background:#fff;border:3px solid var(--sky);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.mitem.lft{border-color:var(--med)}
.mitem.rgt{border-color:var(--coral)}
.mitem.sel{background:var(--gold);border-color:#d1a53a}
.mitem.ok{background:#e3f6e9;border-color:var(--ok);color:#2d7a4b;cursor:default}
.mitem.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* phalanx */
.phax{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:#eaf6f3;border-radius:16px;padding:14px}
.slot{width:64px;height:92px;border-radius:12px;border:3px dashed #9fb0c2;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px}
.slot svg{width:100%;height:100%}
.slot.empty .plus{font-family:var(--head);font-size:2rem;color:#9fb0c2}
.slot.empty:hover{background:var(--cream);border-color:var(--gold)}
.slot.full{border-style:solid;border-color:var(--turq);background:#eafaf6;cursor:default}
/* done card */
.done-card{text-align:center}
.done-card .medimg{width:140px;margin:0 auto 6px;animation:pop .5s}
.done-card .medimg svg{width:100%}
.done-card h2{font-family:var(--head);color:var(--med);font-size:1.8rem;margin:.2em 0}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* journal */
.journal .jgrid{display:flex;flex-direction:column;gap:14px;margin:6px 0 18px}
.jcard{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--sky);border-radius:22px;padding:16px;box-shadow:0 8px 20px rgba(40,120,181,.12)}
.jcard.locked{opacity:.65;border-style:dashed}
.jmed{flex:0 0 90px;width:90px}
.jmed svg{width:100%}
.jlock{font-size:3rem;text-align:center}
.jbody{text-align:left}
.jbody h3{font-family:var(--head);color:var(--med);margin:0 0 6px}
.jbody ul{margin:0;padding-left:20px;line-height:1.5}
.jhint{color:var(--ink2);font-style:italic}
/* results */
.results{text-align:center}
.rankcard{background:linear-gradient(180deg,#fff,var(--cream));border:4px solid var(--rc);border-radius:28px;padding:22px;box-shadow:0 14px 36px rgba(40,120,181,.2);max-width:460px;margin:0 auto 18px}
.rankemo{font-size:4rem;line-height:1}
.ranklbl{font-family:var(--head);color:var(--ink2);margin:4px 0 0;letter-spacing:1px}
.rankname{font-family:var(--head);font-size:2.2rem;color:var(--rc);margin:.1em 0}
.bigscore{font-family:var(--head);font-size:2.6rem;color:var(--med)}
.bigscore span{font-size:1rem;color:var(--ink2)}
.rsec{font-family:var(--head);color:var(--med)}
.rmedrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.rmed{width:120px}
.rmed .rmimg{width:84px;margin:0 auto}
.rmed .rmimg svg{width:100%}
.rmed span{display:block;font-size:.85rem;font-weight:700;margin-top:4px}
.rmed.off{opacity:.5}
.reflect{background:var(--cream);border-radius:20px;padding:18px;margin:14px 0;text-align:left}
.reflect h3{font-family:var(--head);color:var(--med);margin:0 0 6px}
.reflbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.reflb{font-family:var(--body);font-weight:700;background:#fff;border:2px solid var(--turq);border-radius:12px;padding:8px 12px;cursor:pointer}
.reflb.sel{background:var(--turq);color:#fff}
.reflmsg{margin-top:10px;min-height:20px}
/* popup */
.pop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(40,120,181,.35);backdrop-filter:blur(3px);padding:20px}
.pop.show{display:flex;animation:fade .3s}
.pop .box{background:#fff;border:4px solid var(--gold);border-radius:28px;padding:26px;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.medpop .shine{width:150px;margin:0 auto;animation:pop .6s}
.medpop .shine svg{width:100%}
.manual{text-align:left}
.manual .mantitle{font-family:var(--head);color:var(--coral);font-size:1.5rem;text-align:center;margin:.1em 0 .2em}
.manual .mansub{text-align:center;color:#5a7184;margin:0 0 14px;font-size:.95rem}
.manual .manbody{max-height:50vh;overflow-y:auto;padding-right:6px;margin-bottom:16px}
.manrow{display:flex;gap:12px;align-items:flex-start;background:var(--cream);border:2px solid var(--sky);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.manrow .manico{font-size:1.5rem;line-height:1;flex:none}
.manrow b{font-family:var(--head);color:var(--blue);display:block;margin-bottom:2px}
.manrow p{margin:0;font-size:.92rem;color:#38506a;line-height:1.45}
.manual>.btn{display:block;width:100%}
.manual .manbtns{display:flex;gap:10px}
.manual .manbtns .btn{flex:1}
.medpop h3{font-family:var(--head);color:var(--coral);font-size:1.6rem;margin:.2em 0}
.medpop .mname{font-family:var(--head);color:var(--med);font-size:1.3rem;margin:.1em 0}
.medpop .msub{color:var(--ink2);line-height:1.45;margin:.4em 0 1em}
/* toast + confetti */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-family:var(--head);padding:12px 22px;border-radius:30px;z-index:60;opacity:0;transition:.3s;box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* === end styles === */
/* ===== FINAL MISSION CINEMATIC ===== */
.finalscene{position:relative;height:420px;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 12px 34px rgba(40,120,181,.2);background:linear-gradient(180deg,#ffd9a0 0%,#ffc08a 32%,#ffe6c2 55%,#f3e0b0 100%)}
.fsun{position:absolute;top:28px;left:50%;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle,#fff6d6 0%,#FFD166 55%,#ffb24d 100%);box-shadow:0 0 50px 18px rgba(255,209,102,.55);animation:fsun 4s ease-in-out infinite}
@keyframes fsun{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.fsun::after{content:'';position:absolute;inset:-26px;border-radius:50%;border:4px dashed rgba(255,255,255,.4);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fhills{position:absolute;bottom:92px;left:0;right:0;height:120px;background:linear-gradient(180deg,#9BBF75,#7fa557);clip-path:polygon(0 100%,0 55%,18% 30%,36% 58%,54% 22%,72% 55%,90% 28%,100% 50%,100% 100%);opacity:.9}
.fground{position:absolute;bottom:0;left:0;right:0;height:96px;background:linear-gradient(180deg,#cbab6e,#b1894f)}
.fground::before{content:'';position:absolute;top:0;left:0;right:0;height:10px;background:#9BBF75;opacity:.6}
.ftroops{position:absolute;bottom:58px;left:0;right:0;height:170px;display:flex;align-items:flex-end;gap:2px;padding-left:16px}
.march{flex:0 0 auto;opacity:0;transform:translateX(-520px)}
.march.go{animation:marchIn 1s ease-out forwards}
.march svg{display:block;height:100%;width:auto}
.march.m-alx{height:150px;z-index:5;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.march.soldier{height:118px;margin-left:-26px}
.march.go .bobwrap,.march.go svg{animation:bob2 .6s ease-in-out infinite}
@keyframes marchIn{0%{opacity:0;transform:translateX(-520px)}100%{opacity:1;transform:translateX(0)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.fdust{position:absolute;bottom:56px;width:40px;height:16px;background:rgba(255,255,255,.55);border-radius:50%;opacity:0;animation:dust 1.4s ease-out infinite}
@keyframes dust{0%{opacity:0;transform:translateX(0) scale(.6)}30%{opacity:.6}100%{opacity:0;transform:translateX(-60px) scale(1.4)}}
.fbanner{position:absolute;top:120px;left:0;right:0;text-align:center;opacity:0;transform:scale(.6);z-index:6}
.fbanner.go{animation:bannerIn .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bannerIn{to{opacity:1;transform:scale(1)}}
.fbanner h2{font-family:var(--head);font-size:2.4rem;color:#fff;margin:0;text-shadow:3px 3px 0 var(--coral),-1px -1px 0 var(--med)}
.fbanner p{font-family:var(--head);color:#fff;margin:6px 0 0;font-size:1.1rem;text-shadow:2px 2px 0 rgba(40,120,181,.6)}
.fspark{position:absolute;color:#fff;font-size:1.4rem;opacity:0;animation:spark 1.6s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
.finalcta{text-align:center;margin-top:16px;opacity:0;animation:fade .5s ease .2s forwards}
.skipf{position:absolute;top:10px;right:12px;z-index:8;background:rgba(255,255,255,.85);border:none;border-radius:12px;padding:6px 12px;font-family:var(--head);color:var(--med);cursor:pointer}
/* ===== MISSION CARDS (map start buttons) ===== */
.pinlabel rect{fill:#fff;stroke:#2878B5;stroke-width:2}
.pinlabel text{font-family:var(--head);font-size:15px;fill:var(--med);text-anchor:middle;font-weight:700}
.pin.lock .pinlabel rect{stroke:#9fb0c2}
.pin.lock .pinlabel text{fill:#8296ab}
.pin.done .pinlabel rect{stroke:#5fb37a}
.misscards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.misscard{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--sky);border-radius:20px;padding:14px;box-shadow:0 8px 20px rgba(40,120,181,.12);transition:.15s}
.misscard.open{border-color:var(--med)}
.misscard.open:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(40,120,181,.2)}
.misscard.done{border-color:var(--ok);background:#f2fbf5}
.misscard.lock{opacity:.72;border-style:dashed}
.mcno{flex:0 0 52px;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:1.6rem;color:#fff;background:var(--med)}
.misscard.done .mcno{background:var(--ok)}
.misscard.lock .mcno{background:#9fb0c2}
.misscard.final .mcno{background:var(--gold);color:#7a5b12}
.mcinfo{flex:1;text-align:left}
.mcinfo h3{font-family:var(--head);color:var(--ink);margin:0;font-size:1.15rem}
.mcinfo p{margin:2px 0 6px;color:var(--ink2);font-size:.9rem}
.mcbadge{font-family:var(--head);font-size:.78rem;padding:3px 10px;border-radius:20px}
.mcbadge.done{background:#d6f3e0;color:#2d7a4b}
.mcbadge.open{background:#dcecfb;color:var(--med)}
.mcbadge.lock{background:#e7edf3;color:#8296ab}
.mcbtn{flex:0 0 auto;align-self:center;font-family:var(--head);font-size:1rem;background:var(--med);color:#fff;border:none;border-radius:14px;padding:11px 18px;cursor:pointer;box-shadow:0 4px 0 #1f5d90}
.mcbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f5d90}
.mcbtn.ghost{background:var(--turq);box-shadow:0 4px 0 #2fa894}
.mcbtn.final{background:var(--gold);color:#7a5b12;box-shadow:0 4px 0 #d1a53a}
.mcbtn:disabled{background:#c3cedb;box-shadow:0 4px 0 #a6b4c4;cursor:not-allowed}
/* ===== WAR COUNCIL (choices) ===== */
.council{display:flex;flex-direction:column;gap:16px;margin:10px 0}
.decision{background:var(--cream);border-radius:18px;padding:14px 16px;border:2px solid var(--sky)}
.dechead{font-family:var(--head);font-size:1.15rem;color:var(--med);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.decicon{font-size:1.4rem}
.decopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.decopt{text-align:left;background:#fff;border:3px solid var(--sky);border-radius:14px;padding:12px;cursor:pointer;font-family:var(--body);transition:.15s}
.decopt b{display:block;font-family:var(--head);color:var(--ink);font-size:1rem;margin-bottom:4px}
.decopt span{font-size:.85rem;color:var(--ink2);line-height:1.35;display:block}
.decopt:hover{transform:translateY(-2px);border-color:var(--med)}
.decopt.sel{background:#fff6d6;border-color:var(--gold);box-shadow:0 4px 0 #d1a53a}
/* ===== BATTLE ANIMATION ===== */
.battlescene{position:relative;height:430px;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 12px 34px rgba(40,120,181,.2);background:linear-gradient(180deg,#aee0ff 0%,#d6f0ff 45%,#f0e4bd 100%)}
.army{position:absolute;bottom:72px;display:flex;align-items:flex-end;gap:1px;transition:transform 1.1s cubic-bezier(.3,.7,.4,1),opacity .9s ease;z-index:4}
.army.ally{left:5%}
.army.foe{right:5%}
.army.foe .unit{transform:scaleX(-1)}
.unit{width:66px;height:96px;flex:0 0 auto}
.unit svg{width:100%;height:100%;display:block;animation:bob2 .6s ease-in-out infinite;animation-delay:var(--d)}
.unit.cmd{width:92px;height:128px;margin-right:-6px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.battlescene.approach .ally{transform:translateX(120px)}
.battlescene.approach .foe{transform:translateX(-120px)}
.battlescene.clash{animation:shakeScene .16s linear 5}
@keyframes shakeScene{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.battlescene.win .ally{transform:translateX(240px)}
.battlescene.win .foe{transform:translateX(520px);opacity:0}
.battlescene.lose .ally{transform:translateX(-280px);opacity:.1}
.battlescene.lose .foe{transform:translateX(-210px)}
.clashfx{position:absolute;top:150px;left:50%;font-size:3.4rem;opacity:0;transform:translate(-50%,-50%) scale(0);z-index:7;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.battlescene.clash .clashfx{animation:clashpop .7s ease}
@keyframes clashpop{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-40deg)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.5) rotate(12deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(0)}}
.battlebanner{position:absolute;top:34px;left:0;right:0;text-align:center;opacity:0;transform:scale(.5);z-index:8}
.battlebanner.go{animation:bannerIn .6s cubic-bezier(.2,1.4,.4,1) forwards}
.bwin{font-family:var(--head);font-size:clamp(2rem,6vw,2.8rem);color:#fff;text-shadow:3px 3px 0 var(--ok),-1px -1px 0 var(--med)}
.blose{font-family:var(--head);font-size:clamp(1.6rem,5vw,2.2rem);color:#fff;text-shadow:3px 3px 0 var(--coral),-1px -1px 0 var(--med)}
.battlestatus{text-align:center;font-family:var(--head);color:var(--ink2);margin-top:14px;font-size:1.05rem}
/* ===== OUTCOME PANEL ===== */
.outcome{text-align:center}
.outcome .medimg{width:130px;margin:0 auto 6px;animation:pop .5s}
.outcome .medimg svg{width:100%}
.outcome h2{font-family:var(--head);margin:.2em 0;font-size:1.7rem}
.outcome.win h2{color:#2d7a4b}
.outcome.lose h2{color:var(--coral)}
.tips{background:var(--cream);border-radius:16px;padding:14px 18px;text-align:left;margin:14px 0}
.tipshd{font-family:var(--head);color:var(--med);margin:0 0 6px}
.tips ul{margin:0;padding-left:20px;line-height:1.55}
.tips li{margin-bottom:6px}
.tips b{color:var(--med)}
.ekit{display:inline-block;font-family:var(--head);font-size:.95rem;letter-spacing:1px;text-transform:uppercase;color:var(--med);background:#fff;border:2px solid var(--gold);border-radius:999px;padding:5px 16px;margin-bottom:8px;box-shadow:0 3px 0 #d1a53a}
</style>
</head>
<body>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');

/* ====================== SVG ART ====================== */
const A={};
/* Alexios — friendly cartoon commander */

<path d="M57 76 Q65 82 73 76" fill="none" stroke="#9a6a3a" stroke-width="3" stroke-linecap="round"/>

<path d="M46 60 Q46 52 65 50 Q84 52 84 60 L84 66 L46 66Z" fill="#e9b957"/>
<rect x="62" y="54" width="6" height="18" rx="2" fill="#e9b957"/>
<!-- crest -->
<path d="M60 32 Q65 10 70 32 Q80 14 78 30 Z" fill="#FF956B"/><path d="M58 30 Q65 16 72 30Z" fill="#e06a4b"/>

/* a floating head-only Alexios for small feedback avatars */
A.alexHead=`<svg viewBox="0 0 90 90"><circle cx="45" cy="50" r="24" fill="#f3d2a0"/><circle cx="37" cy="50" r="3" fill="#355070"/><circle cx="53" cy="50" r="3" fill="#355070"/><circle cx="33" cy="56" r="4" fill="#ff9e8f" opacity=".6"/><circle cx="57" cy="56" r="4" fill="#ff9e8f" opacity=".6"/><path d="M38 60 Q45 65 52 60" fill="none" stroke="#9a6a3a" stroke-width="3" stroke-linecap="round"/><path d="M20 46 Q20 22 45 20 Q70 22 70 46 L63 46 Q63 30 45 28 Q27 30 27 46Z" fill="#d9a441" stroke="#b9832f" stroke-width="2"/><path d="M40 20 Q45 2 50 20 Q60 6 58 20Z" fill="#FF956B"/></svg>`;
/* cartoon Greek ship */
A.ship=`<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg">

</svg>`;
/* small top-down-ish ship marker for map */
A.shipMini=`<g><path d="M-30 8 Q0 26 30 8 L24 -2 L-24 -2Z" fill="#8a5a2b" stroke="#6b4420" stroke-width="2"/><rect x="-22" y="-6" width="44" height="6" rx="2" fill="#b5793c"/><line x1="0" y1="-6" x2="0" y2="-34" stroke="#6b4420" stroke-width="3"/><path d="M2 -32 Q24 -22 24 -8 L2 -6Z" fill="#FFF9EC" stroke="#48C9B0" stroke-width="2"/><path d="M-30 8 l-10 -5 l10 -3Z" fill="#6b4420"/></g>`;

A.enemy=`<svg viewBox="0 0 60 90"><ellipse cx="30" cy="85" rx="16" ry="4" fill="#7a3b50" opacity=".15"/><rect x="24" y="58" width="6" height="24" rx="3" fill="#e7c38a"/><rect x="32" y="58" width="6" height="24" rx="3" fill="#e7c38a"/><path d="M18 40 Q30 34 42 40 L44 62 Q30 68 16 62Z" fill="#9c4a5e"/><circle cx="18" cy="52" r="14" fill="#7a5fa0" stroke="#5c4680" stroke-width="2"/><path d="M18 42 v20 M8 52 h20" stroke="#d7c9ee" stroke-width="2"/><line x1="46" y1="18" x2="46" y2="78" stroke="#8a5a2b" stroke-width="3"/><path d="M46 16 l4 8 l-8 0Z" fill="#cfcfcf"/><circle cx="30" cy="26" r="12" fill="#f3d2a0"/><path d="M18 24 Q18 10 30 9 Q42 10 42 24 L37 24 Q37 15 30 14 Q23 15 23 24Z" fill="#aab0b5"/><path d="M26 9 Q30 -2 34 9Z" fill="#b5495e"/><circle cx="27" cy="26" r="2" fill="#355070"/><circle cx="33" cy="26" r="2" fill="#355070"/></svg>`;
/* equipment */
A.hoplon=`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="#FF956B" stroke="#d96a44" stroke-width="6"/><circle cx="60" cy="60" r="34" fill="none" stroke="#ffd9c6" stroke-width="5"/><circle cx="60" cy="60" r="20" fill="none" stroke="#ffd9c6" stroke-width="4"/><circle cx="60" cy="60" r="8" fill="#fff"/></svg>`;

/* ====================== SOUND & MUSIC (Web Audio, offline) ====================== */
const SND={
  ctx:null,on:true,master:null,musicGain:null,seqTimer:null,step:0,playing:false,mode:'normal',
  ensure(){
    if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ctx=new AC();
    this.master=this.ctx.createGain();this.master.gain.value=0.9;this.master.connect(this.ctx.destination);
    this.musicGain=this.ctx.createGain();this.musicGain.gain.value=0.26;this.musicGain.connect(this.master);
  },
  resume(){this.ensure();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  blip(freq,t0,dur,type,vol,dest){
    if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol||0.3,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(dest||this.master);o.start(t0);o.stop(t0+dur+0.03);
  },
  hat(t0,vol){
    if(!this.ctx)return;const len=Math.floor(this.ctx.sampleRate*0.05);
    const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=this.ctx.createBufferSource();s.buffer=b;const g=this.ctx.createGain();g.gain.value=vol||0.08;
    s.connect(g);g.connect(this.musicGain);s.start(t0);
  },
  correct(){if(!this.on)return;this.resume();if(!this.ctx)return;const t=this.ctx.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>this.blip(f,t+i*0.085,0.2,'triangle',0.32));},
  wrong(){if(!this.on)return;this.resume();if(!this.ctx)return;const t=this.ctx.currentTime;this.blip(311.13,t,0.18,'sawtooth',0.2);this.blip(233.08,t+0.12,0.28,'sawtooth',0.2);},
  ding(){if(!this.on)return;this.resume();if(!this.ctx)return;const t=this.ctx.currentTime;this.blip(880,t,0.14,'triangle',0.28);this.blip(1318.5,t+0.07,0.16,'triangle',0.24);},
  click(){if(!this.on)return;this.resume();if(!this.ctx)return;const t=this.ctx.currentTime;this.blip(1200,t,0.045,'square',0.12);},
  startMusic(mode){
    this.resume();if(mode)this.mode=mode;if(!this.ctx||this.playing||!this.on)return;this.playing=true;this.step=0;
    const SONGS={
      normal:{bpm:126,melVol:0.15,bassVol:0.22,melType:'triangle',
        mel:[659.25,0,659.25,783.99,880,0,783.99,659.25,587.33,0,659.25,0,880,987.77,1046.5,0],
        bass:[130.81,0,196,0,164.81,0,196,0,146.83,0,220,0,130.81,0,196,0]},
      epic:{bpm:132,melVol:0.2,bassVol:0.32,melType:'sawtooth',
        mel:[587.33,0,698.46,0,880,0,783.99,698.46,587.33,0,698.46,587.33,523.25,0,587.33,0],
        bass:[146.83,146.83,146.83,146.83,174.61,174.61,174.61,174.61,196,196,196,196,130.81,130.81,146.83,146.83]}
    };
    const cfg=SONGS[this.mode]||SONGS.normal;
    const bpm=cfg.bpm,stepDur=60/bpm/2;
    const mel=cfg.mel,bass=cfg.bass,epic=this.mode==='epic';
    const tick=()=>{
      if(!this.playing){return;}
      const t=this.ctx.currentTime+0.03,s=this.step%16;
      if(mel[s])this.blip(mel[s],t,stepDur*0.9,cfg.melType,cfg.melVol,this.musicGain);
      if(bass[s])this.blip(bass[s],t,stepDur*(epic?1.0:1.6),'sine',cfg.bassVol,this.musicGain);
      if(epic){
        this.hat(t,s%2===0?0.12:0.07);
        if(s%4===0)this.blip(65.41,t,0.18,'sine',0.4,this.musicGain);
      }else{
        if(s%2===0)this.hat(t,0.05);
        if(s%4===0)this.hat(t,0.1);
      }
      this.step++;this.seqTimer=setTimeout(tick,stepDur*1000);
    };tick();
  },
  setMode(mode){
    if(mode===this.mode)return;this.mode=mode;
    if(this.playing&&this.on){this.stopMusic();this.startMusic(mode);}
  },
  stopMusic(){this.playing=false;if(this.seqTimer){clearTimeout(this.seqTimer);this.seqTimer=null;}},
  toggle(){this.on=!this.on;if(this.on){this.ensure();this.resume();this.startMusic();}else{this.stopMusic();}return this.on;}
};

/* questions:[{q,img,opts:[],ans:idx,fb}]  onDone(correctFirstCount,total) */
function QuizEngine(mount,questions,opts){
  opts=opts||{};const pts=opts.pts||10;
  let i=0,firstCount=0,answeredFirst=false,finished=0;
  function render(){
    const Q=questions[i];answeredFirst=false;
    mount.innerHTML=`<div class="qcard">
      <div class="qprog">Soalan ${i+1} / ${questions.length}</div>
      ${Q.img?`<div class="qimg">${Q.img}</div>`:''}
      <h3 class="qtext">${Q.q}</h3>
      <div class="opts">${Q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
      <div class="qfb" id="qfb"></div>
      <div class="qnav"><button class="btn ghost" id="qnext" disabled>Seterusnya \u2192</button></div>
    </div>`;
    mount.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,Q));
    $('#qnext',mount).onclick=next;
  }
  function pick(btn,Q){
    const k=+btn.dataset.k;if(btn.classList.contains('locked'))return;
    const correct=k===Q.ans;const fb=$('#qfb',mount);
    if(correct){
      SND.correct();
      mount.querySelectorAll('.opt').forEach(b=>{b.classList.add('locked');if(+b.dataset.k===Q.ans)b.classList.add('right');});
      if(!answeredFirst){firstCount++;addScore(pts);toast('+'+pts+' mata');}
      fb.innerHTML=`<div class="fb good">${A.alexHead}<div><b>Betul! \u2b50</b><br>${Q.fb}</div></div>`;
      $('#qnext',mount).disabled=false;$('#qnext',mount).classList.remove('ghost');
    }else{
      SND.wrong();
      answeredFirst=true;
      btn.classList.add('wrong','locked');
      fb.innerHTML=`<div class="fb bad">${A.alexHead}<div><b>Cuba lagi!</b><br>Jawapan itu belum tepat. Fikir sekali lagi, kamu boleh!</div></div>`;
    }
  }
  function next(){i++;if(i>=questions.length){opts.onDone&&opts.onDone(firstCount,questions.length);}else render();}
  render();
}

function placeShip(done,total){
  const path=$('#searoute');const ship=$('#shipM');if(!path||!ship)return;
  const len=path.getTotalLength();
  const seg=Math.min(done,4)/4;const p=path.getPointAtLength(len*seg*0.98+ (seg===0?10:0));
  ship.setAttribute('transform',`translate(${p.x},${p.y}) scale(1.1)`);
}
/* ====================== MISSION SCAFFOLD ====================== */
function runMission(cfg){
  let stage=0;const stages=cfg.stages;
  function go(){
    if(stage>=stages.length){
      S.done[cfg.id]=true;save();
      if(!S.journal.includes(cfg.id)){S.journal.push(cfg.id);save();}
      award(cfg.medal);
      finishScreen();return;
    }
    const box=$('#stageBox');stages[stage](box,()=>{stage++;go();});
  }
  function finishScreen(){
    const box=$('#stageBox');
    box.innerHTML=`<div class="done-card"><div class="medimg">${A.medal(MEDALS[cfg.medal].col)}</div>
      <h2>Misi Selesai! \ud83c\udf89</h2>
      <p>${speech('Hebat sungguh, wira muda! Kamu telah memperoleh <b>'+MEDALS[cfg.medal].name+'</b>. Mari teruskan pengembaraan!',true)}</p>
      <div class="row"><button class="btn" id="toMap">\ud83c\udfe0 Kembali ke Peta</button>${cfg.next?`<button class="btn ghost" id="toNext">Misi Seterusnya \u2192</button>`:''}</div></div>`;
    $('#toMap').onclick=()=>route('map');
    if(cfg.next)$('#toNext').onclick=()=>route(cfg.next);
  }
  mount(`<div class="misshd"><span class="misstag">${cfg.tag}</span><h2 class="misstitle">${cfg.title}</h2></div><div id="stageBox" class="stagebox"></div>`,true);
  go();
}

/* HOTSPOT stage: scene + clickable spots; pick exactly correct set */
function hotspotStage(cfg){return (box,done)=>{
  const need=cfg.spots.filter(s=>s.good).length;const picked=new Set();
  box.innerHTML=`<div class="activity"><h3>${cfg.title}</h3><p class="stginfo">${cfg.info}</p>
    <div class="scene">${cfg.scene}<svg class="spotlayer" viewBox="0 0 ${cfg.w} ${cfg.h}">${cfg.spots.map((s,i)=>`<g class="spot" data-i="${i}" transform="translate(${s.x},${s.y})"><circle r="26" class="spotc"/><text y="6">?</text></g>`).join('')}</svg></div>
    <div class="hsfb" id="hsfb">Pilih <b>${need}</b> tempat terbaik.</div>
    <div class="row"><button class="btn" id="hsCheck">Sahkan Pilihan</button></div></div>`;
  box.querySelectorAll('.spot').forEach(g=>g.addEventListener('click',()=>{const i=+g.dataset.i;if(g.classList.contains('locked'))return;if(picked.has(i)){picked.delete(i);g.classList.remove('sel');}else{picked.add(i);g.classList.add('sel');}}));
  $('#hsCheck',box).onclick=()=>{
    let right=0,wrong=0;
    cfg.spots.forEach((s,i)=>{const g=box.querySelector('.spot[data-i="'+i+'"]');if(picked.has(i)){if(s.good){right++;g.classList.add('good','locked');}else{wrong++;g.classList.add('bad');}}});
    const fb=$('#hsfb',box);
    if(right===need&&wrong===0){addScore(20);confetti();SND.correct();fb.innerHTML=`<span class="ok">\u2705 Tepat sekali! ${cfg.success}</span>`;box.querySelectorAll('.spot').forEach(g=>g.classList.add('locked'));$('#hsCheck',box).textContent='Teruskan \u2192';$('#hsCheck',box).onclick=done;}
    else{fb.innerHTML=`<span class="no">Belum tepat. ${cfg.hint} Cuba lagi!</span>`;SND.wrong();setTimeout(()=>{picked.clear();box.querySelectorAll('.spot').forEach(g=>g.classList.remove('sel','bad'));},900);}
  };
};}

/* SORT stage: items into bins */
function sortStage(cfg){return (box,done)=>{
  let cur=null;const placed={};
  box.innerHTML=`<div class="activity"><h3>${cfg.title}</h3><p class="stginfo">${cfg.info}</p>
    <div class="items" id="items">${cfg.items.map((it,i)=>`<button class="item" data-i="${i}">${it.icon||''}<span>${it.name}</span></button>`).join('')}</div>
    <div class="bins">${cfg.bins.map((b,bi)=>`<div class="bin" data-b="${bi}"><div class="binhd">${b}</div><div class="bindrop" data-b="${bi}"></div></div>`).join('')}</div>
    <div class="hsfb" id="sfb">Klik satu barang, kemudian klik bakul yang betul.</div>
    <div class="row"><button class="btn" id="sCheck" disabled>Sahkan</button></div></div>`;
  function refresh(){const n=Object.keys(placed).length;$('#sCheck',box).disabled=n<cfg.items.length;}
  box.querySelectorAll('.item').forEach(b=>b.onclick=()=>{box.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));b.classList.add('active');cur=+b.dataset.i;});
  box.querySelectorAll('.bin').forEach(bin=>bin.onclick=()=>{if(cur==null)return;const bi=+bin.dataset.b;const it=cfg.items[cur];placed[cur]=bi;const drop=bin.querySelector('.bindrop');const chip=document.createElement('button');chip.className='chip';chip.innerHTML=it.name;chip.onclick=(e)=>{e.stopPropagation();delete placed[cur];};const srcBtn=box.querySelector('.item[data-i="'+cur+'"]');srcBtn.classList.add('used');srcBtn.disabled=true;drop.appendChild(chip);const ci=cur;chip.onclick=(e)=>{e.stopPropagation();delete placed[ci];chip.remove();srcBtn.classList.remove('used');srcBtn.disabled=false;refresh();};cur=null;box.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));refresh();});
  $('#sCheck',box).onclick=()=>{let ok=0;cfg.items.forEach((it,i)=>{if(placed[i]===it.bin)ok++;});const fb=$('#sfb',box);if(ok===cfg.items.length){addScore(20);confetti();SND.correct();fb.innerHTML='<span class="ok">\u2705 Semua betul! '+cfg.success+'</span>';$('#sCheck',box).textContent='Teruskan \u2192';$('#sCheck',box).onclick=done;}else{fb.innerHTML='<span class="no">'+ok+'/'+cfg.items.length+' betul. Betulkan yang salah dan cuba lagi!</span>';SND.wrong();}};
};}
/* VOCAB cards: flip to learn */
function vocabStage(cfg){return (box,done)=>{
  box.innerHTML=`<div class="activity"><h3>${cfg.title}</h3><p class="stginfo">${cfg.info}</p>
    <div class="vcards">${cfg.cards.map((c,i)=>`<div class="vcard" data-i="${i}"><div class="vinner"><div class="vfront">${c.icon||''}<b>${c.term}</b><span class="vtap">Klik untuk buka</span></div><div class="vback">${c.def}</div></div></div>`).join('')}</div>

    <div class="row"><button class="btn" id="vGo" disabled>Teruskan \u2192</button></div></div>`;
  const seen=new Set();
  box.querySelectorAll('.vcard').forEach(c=>c.onclick=()=>{c.classList.toggle('flip');seen.add(+c.dataset.i);if(seen.size===cfg.cards.length){$('#vGo',box).disabled=false;$('#vfb',box).innerHTML='<span class="ok">Bagus! Kamu dah belajar semua perkataan.</span>';}});
  $('#vGo',box).onclick=done;
};}

/* MATCH stage: term <-> meaning */
function matchStage(cfg){return (box,done)=>{
  const L=cfg.pairs.map((p,i)=>({t:p.t,id:i}));const R=shuffle(cfg.pairs.map((p,i)=>({d:p.d,id:i})));
  let selL=null,matched=0;
  box.innerHTML=`<div class="activity"><h3>${cfg.title}</h3><p class="stginfo">${cfg.info}</p>
    <div class="matchwrap"><div class="mcol">${L.map(x=>`<button class="mitem lft" data-id="${x.id}">${x.t}</button>`).join('')}</div>
    <div class="mcol">${R.map(x=>`<button class="mitem rgt" data-id="${x.id}">${x.d}</button>`).join('')}</div></div>
    <div class="hsfb" id="mfb">Klik perkataan, kemudian klik maksudnya.</div></div>`;
  box.querySelectorAll('.lft').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;box.querySelectorAll('.lft').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selL=b;});
  box.querySelectorAll('.rgt').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok')||!selL)return;if(b.dataset.id===selL.dataset.id){b.classList.add('ok');selL.classList.add('ok');selL.classList.remove('sel');selL=null;matched++;addScore(5);toast('+5 mata');SND.correct();if(matched===cfg.pairs.length){confetti();$('#mfb',box).innerHTML='<span class="ok">\u2705 Semua betul! '+(cfg.success||'')+'</span><div class="row"><button class="btn" id="mGo">Teruskan \u2192</button></div>';$('#mGo',box).onclick=done;}}else{b.classList.add('shake');selL.classList.remove('sel');const s=selL;selL=null;setTimeout(()=>b.classList.remove('shake'),500);SND.wrong();$('#mfb',box).innerHTML='<span class="no">Belum padan. Cuba pasangan lain!</span>';}});
};}

/* PHALANX puzzle: fill the shield wall (no gaps) */
function phalanxStage(cfg){return (box,done)=>{
  const N=8;const filled=new Array(N).fill(false);
  function draw(){
    box.innerHTML=`<div class="activity"><h3>Bina Dinding Phalanx</h3><p class="stginfo">Dalam formasi <b>phalanx</b>, askar berdiri rapat supaya perisai (hoplon) bertindih dan tiada ruang kosong. Klik setiap ruang kosong untuk menempatkan askar dan lengkapkan dinding perisai!</p>
      <div class="phax">${filled.map((f,i)=>`<button class="slot ${f?'full':'empty'}" data-i="${i}">${f?A.hoplite:'<span class=\'plus\'>+</span>'}</button>`).join('')}</div>
      <div class="hsfb" id="pfb">${filled.filter(x=>x).length}/${N} askar ditempatkan.</div></div>`;
    box.querySelectorAll('.slot.empty').forEach(b=>b.onclick=()=>{filled[+b.dataset.i]=true;addScore(3);draw();check();});
  }
  function check(){if(filled.every(x=>x)){confetti();SND.correct();const fb=$('#pfb',box);fb.innerHTML='<span class="ok">\u2705 Dinding phalanx siap! Tiada askar boleh menembusinya.</span><div class="row"><button class="btn" id="pGo">Teruskan \u2192</button></div>';$('#pGo',box).onclick=done;}}
  draw();
};}
