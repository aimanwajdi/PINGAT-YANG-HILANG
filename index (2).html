        <div class="histfact"><div class="hf-t">Tahukah Kamu?</div><p>Pada tahun <b>480 SM</b>, Raja <b>Leonidas</b> dan 300 askar <b>Sparta</b> bertahan di laluan sempit <b>Thermopylae</b> menentang tentera Parsi yang amat ramai \u2014 contoh terbaik memilih tempat yang betul untuk berperang!</p></div>`,'Mula Cabaran \u2192'),
      quizStage(q,'Fikir seperti seorang panglima! Pilih keputusan terbaik untuk setiap keadaan.')
    ]});
};
/* ====================== MISSION 4: KELENGKAPAN ASKAR ====================== */
routes.m4=function(){
  const q=[
    {img:A.dory,q:'Senjata apakah ini?',opts:['Dory (lembing panjang)','Xiphos (pedang)','Hoplon (perisai)'],ans:0,fb:'Betul! <b>Dory</b> ialah lembing panjang untuk menyerang dari jauh.'},
    {img:A.xiphos,q:'Senjata apakah ini?',opts:['Dory','Xiphos (pedang pendek)','Trireme'],ans:1,fb:'Betul! <b>Xiphos</b> ialah pedang pendek untuk pertempuran dekat apabila lembing patah.'},
    {img:A.hoplon,q:'Kelengkapan apakah ini?',opts:['Hoplon (perisai)','Topi keledar','Kapal'],ans:0,fb:'Betul! <b>Hoplon</b> ialah perisai bulat untuk melindungi badan.'},
    {img:A.trireme,q:'Apakah ini?',opts:['Rumah','Trireme (kapal perang)','Kereta kuda'],ans:1,fb:'Betul! <b>Trireme</b> ialah kapal perang laju Yunani dengan tiga baris pendayung.'},
    {q:'Kelengkapan manakah yang melindungi askar (bukan untuk menyerang)?',opts:['Dory','Hoplon dan topi keledar','Xiphos'],ans:1,fb:'Betul! <b>Hoplon</b> dan <b>topi keledar</b> ialah kelengkapan melindungi. Dory dan xiphos pula senjata menyerang.'}
  ];
  runMission({id:'m4',medal:'equip',next:'final',tag:'Misi 4 \u2022 Kelengkapan',title:'\ud83d\udee1\ufe0f Kelengkapan Askar Yunani',
    stages:[
      introStage(`${speech('Seorang hoplite membawa banyak kelengkapan! Ada yang untuk <b>melindungi</b> diri, ada yang untuk <b>menyerang</b> musuh, dan ada pula untuk berperang di <b>laut</b>. Mari kita kenali satu persatu.')}
        <div class="infogrid g4"><div class="infobox">${A.hoplon}<p><b>Hoplon</b><br>Perisai (lindung)</p></div><div class="infobox">${A.dory}<p><b>Dory</b><br>Lembing (serang)</p></div><div class="infobox">${A.xiphos}<p><b>Xiphos</b><br>Pedang (serang)</p></div><div class="infobox">${A.trireme}<p><b>Trireme</b><br>Kapal (laut)</p></div></div>
        <div class="histfact"><div class="hf-t">Tahukah Kamu?</div><p>Perisai <b>hoplon</b> seberat lebih 7 kilogram diperbuat daripada kayu dan tembaga. Askar memegangnya di lengan kiri \u2014 jadi ia turut melindungi kawan di sebelah kirinya dalam barisan phalanx!</p></div>`,'Mula Kuiz \u2192'),
      quizStage(q,'Kenal pasti setiap kelengkapan!'),
      sortStage({title:'Susun Kelengkapan ke Bakul',info:'Klik satu barang, kemudian klik bakul yang betul: <b>Melindungi</b>, <b>Menyerang</b>, atau <b>Laut</b>.',
        bins:['\ud83d\udee1\ufe0f Melindungi','\u2694\ufe0f Menyerang','\ud83c\udf0a Laut'],
        items:[
          {name:'Hoplon',icon:'',bin:0},
          {name:'Topi keledar',icon:'',bin:0},
          {name:'Dory',icon:'',bin:1},
          {name:'Xiphos',icon:'',bin:1},
          {name:'Trireme',icon:'',bin:2}
        ],
        success:'Kamu tahu untuk guna setiap kelengkapan dengan betul!'})
    ]});
};
/* ====================== HERO'S JOURNAL ====================== */
const JOURNAL={
  m1:{t:'Pertahanan Kota',med:'defence',pts:['Bandar Yunani (polis) dilindungi tembok tinggi.','Pintu gerbang & menara ialah tempat paling penting dikawal.','Askar bertahan lebih kuat apabila bekerjasama.']},
  m2:{t:'Tentera & Phalanx',med:'army',pts:['Hoplite ialah askar pejalan kaki Yunani.','Phalanx = barisan rapat dengan perisai bertindih.','Dory (lembing) & xiphos (pedang) ialah senjata mereka.']},
  m3:{t:'Strategi Perang',med:'strategy',pts:['Strategi = rancangan besar; taktik = pilihan formasi & tempat.','Padang rata sesuai untuk phalanx.','Laluan sempit mudah dipertahankan askar sedikit.']},
  m4:{t:'Kelengkapan Askar',med:'equip',pts:['Hoplon & topi keledar untuk melindungi.','Dory & xiphos untuk menyerang.','Trireme ialah kapal perang di laut.']}
};
routes.journal=function(){
  const items=Object.keys(JOURNAL).map(k=>{const j=JOURNAL[k];const got=S.done[k];return `<div class="jcard ${got?'':'locked'}"><div class="jmed">${got?A.medal(MEDALS[j.med].col):'<div class=\'jlock\'>\ud83d\udd12</div>'}</div><div class="jbody"><h3>${j.t}</h3>${got?'<ul>'+j.pts.map(p=>'<li>'+p+'</li>').join('')+'</ul>':'<p class="jhint">Selesaikan misi ini untuk membuka catatan.</p>'}</div></div>`;}).join('');
  mount(`<div class="journal"><div class="misshd"><span class="misstag">Koleksi</span><h2 class="misstitle">\ud83d\udcd6 Jurnal Wira</h2></div>
    ${speech('Inilah jurnal kita! Setiap kali kamu selesaikan misi, kamu memperoleh satu pingat dan catatan baru. Lihat apa yang telah kamu pelajari!',true)}
    <div class="jgrid">${items}</div>
    <div class="row"><button class="btn" id="jMap">\ud83c\udfe0 Kembali ke Peta</button></div></div>`,true);
  $('#jMap').onclick=()=>route('map');
};
/* ====================== FINAL CHALLENGE (STRATEGY BATTLE) ====================== */
routes.final=function(){
  if(!(S.done.m1&&S.done.m2&&S.done.m3&&S.done.m4)){toast('Selesaikan keempat-empat misi dahulu!');route('map');return;}
  if(!S.finalEarned)S.finalEarned={};
  finalCinematic(()=>warCouncil());
};
/* the 4 strategic decisions — scenario: outnumbered army */
const WAR=[
  {key:'terrain',icon:'\ud83d\uddfa\ufe0f',q:'1. Di manakah kita patut berperang?',ans:1,
    opts:[
      {t:'Padang rata terbuka',d:'Musuh yang ramai boleh mengepung kita dari semua arah.'},
      {t:'Laluan sempit antara gunung',d:'Hanya sedikit musuh boleh masuk serentak, jadi bilangan kita yang kecil tidak menjadi masalah.'},
      {t:'Pantai berpasir terbuka',d:'Pasir melambatkan pergerakan dan mudah dikepung.'}
    ],fb:'Di <b>laluan sempit</b>, musuh tidak boleh masuk ramai sekaligus \u2014 inilah rahsia menang walaupun kita sedikit!'},
  {key:'formation',icon:'\ud83d\udee1\ufe0f',q:'2. Formasi apakah yang kita gunakan?',ans:0,
    opts:[
      {t:'Phalanx (barisan rapat, perisai bertindih)',d:'Perisai bertindih membentuk dinding yang kuat dan susah ditembusi.'},
      {t:'Berselerak sendiri-sendiri',d:'Setiap askar bersendirian dan mudah dikalahkan.'},
      {t:'Satu barisan nipis yang panjang',d:'Barisan nipis mudah pecah apabila diserang.'}
    ],fb:'<b>Phalanx</b> menjadikan askar saling melindungi \u2014 dinding perisai yang hebat!'},
  {key:'weapon',icon:'\u2694\ufe0f',q:'3. Senjata utama di barisan hadapan?',ans:0,
    opts:[
      {t:'Dory (lembing panjang)',d:'Lembing panjang boleh mencucuk musuh sebelum mereka sampai kepada kita.'},
      {t:'Xiphos sahaja (pedang pendek)',d:'Pedang pendek hanya berguna apabila musuh sudah terlalu dekat.'},
      {t:'Tanpa senjata',d:'Tidak mungkin menang tanpa senjata!'}
    ],fb:'<b>Dory</b> yang panjang membolehkan barisan hadapan menyerang musuh dari jauh dahulu.'},
  {key:'tactic',icon:'\ud83e\udde0',q:'4. Apakah taktik kita?',ans:0,
    opts:[
      {t:'Bertahan rapat & maju serentak',d:'Bergerak bersama menjaga dinding perisai sentiasa kuat.'},
      {t:'Setiap askar menyerang sendiri',d:'Barisan akan pecah dan timbul ruang kosong.'},
      {t:'Berundur terus tanpa melawan',d:'Menyerah kalah tanpa mencuba.'}
    ],fb:'<b>Bertahan rapat dan maju serentak</b> memastikan phalanx kekal kuat sehingga musuh berundur.'}
];
/* war council: student makes the choices */
function warCouncil(){
  const picks={};
  mount(`<div class="misshd"><span class="misstag gold">Cabaran Akhir</span><h2 class="misstitle">\ud83c\udfc6 Misi Perang Panglima</h2></div>
    <div class="stagebox">
      ${speech('Wira muda, tentera musuh <b>tiga kali lebih ramai</b> daripada kita! Sebagai panglima, buat keputusan bijak. Pilih tempat, formasi, senjata dan taktik yang terbaik. Keputusan kamu akan menentukan siapa menang!',true)}
      <div class="council" id="council">
        ${WAR.map((d,di)=>`<div class="decision" data-d="${di}"><div class="dechead"><span class="decicon">${d.icon}</span>${d.q}</div><div class="decopts">${d.opts.map((o,oi)=>`<button class="decopt" data-d="${di}" data-o="${oi}"><b>${o.t}</b><span>${o.d}</span></button>`).join('')}</div></div>`).join('')}
      </div>
      <div class="hsfb" id="cfb">Buat kesemua 4 pilihan, kemudian lancarkan serangan!</div>
      <div class="row"><button class="btn big" id="launch" disabled>\u2694\ufe0f Lancarkan Serangan!</button></div>
    </div>`,true);
  const box=$('#council');
  box.querySelectorAll('.decopt').forEach(b=>b.onclick=()=>{const di=+b.dataset.d,oi=+b.dataset.o;picks[di]=oi;box.querySelectorAll('.decopt[data-d="'+di+'"]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(Object.keys(picks).length===WAR.length){$('#launch').disabled=false;$('#cfb').innerHTML='<span class="ok">Semua keputusan dibuat! Lancarkan serangan apabila sedia.</span>';}});
  $('#launch').onclick=()=>battleResolve(picks);
}
/* resolve: score, play battle animation, show outcome */
function battleResolve(picks){
  let correct=0;const wrongList=[];
  WAR.forEach((d,di)=>{if(picks[di]===d.ans){correct++;if(!S.finalEarned[d.key]){S.finalEarned[d.key]=true;addScore(15);}}else{wrongList.push(d);}});
  const win=correct===WAR.length;save();
  playBattle(win,()=>battleOutcome(win,correct,wrongList));
}
/* cinematic lead-in: Alexios leads a marching phalanx into the final battle */
function finalCinematic(onStart){
  const soldiers=[0,1,2,3,4].map(i=>`<div class="march soldier" style="animation-delay:${0.25+i*0.22}s">${A.hoplite}</div>`).join('');
  const dust=[0,1,2].map(i=>`<div class="fdust" style="left:${90+i*120}px;animation-delay:${i*0.5}s"></div>`).join('');
  mount(`<div class="misshd"><span class="misstag gold">Cabaran Akhir</span><h2 class="misstitle">\ud83c\udfc6 Ujian Panglima Agung</h2></div>
    <div class="finalscene" id="fscene">
      <button class="skipf" id="fskip">Langkau \u00bb</button>
      <div class="fsun"></div><div class="fhills"></div><div class="fground"></div>
      <span class="fspark" style="top:70px;left:24%">\u2728</span><span class="fspark" style="top:96px;right:22%;animation-delay:.6s">\u2728</span>
      ${dust}
      <div class="ftroops"><div class="march m-alx" style="animation-delay:.05s">${A.alexios}</div>${soldiers}</div>
      <div class="fbanner" id="fbanner"><h2>Pertempuran Terakhir!</h2><p>Pimpin tenteramu ke medan akhir, wira muda!</p></div>
    </div>
    <div class="finalcta"><button class="btn big" id="fStart">\u2694\ufe0f Mula Misi Perang \u2192</button></div>`,true);
  const scene=$('#fscene');
  requestAnimationFrame(()=>{scene.querySelectorAll('.march').forEach(m=>m.classList.add('go'));setTimeout(()=>{const b=$('#fbanner');if(b)b.classList.add('go');},1500);});
  $('#fStart').onclick=onStart;
  $('#fskip').onclick=onStart;
};
/* play the battle animation: two armies clash, one side wins */
function playBattle(win,done){
  const ally=[A.alexios,A.hoplite,A.hoplite,A.hoplite].map((s,i)=>`<div class="unit${i===0?' cmd':''}" style="--d:${i*0.12}s">${s}</div>`).join('');
  const foe=[A.enemy,A.enemy,A.enemy,A.enemy].map((s,i)=>`<div class="unit" style="--d:${i*0.12}s">${s}</div>`).join('');
  mount(`<div class="misshd"><span class="misstag gold">Cabaran Akhir</span><h2 class="misstitle">\u2694\ufe0f Pertempuran Bermula!</h2></div>
    <div class="battlescene" id="bscene">
      <div class="fsun"></div><div class="fhills"></div><div class="fground"></div>
      <div class="army ally">${ally}</div>
      <div class="army foe">${foe}</div>
      <div class="clashfx">\u2694\ufe0f</div>
      <div class="battlebanner" id="bbanner"></div>
    </div>
    <p class="battlestatus" id="bstatus">Kedua-dua tentera berarak ke medan perang\u2026</p>`,true);
  const scene=$('#bscene');
  setTimeout(()=>{scene.classList.add('approach');$('#bstatus').textContent='Pasukan bertembung di tengah medan!';},500);
  setTimeout(()=>{scene.classList.add('clash');},1700);
  setTimeout(()=>{
    scene.classList.remove('clash');scene.classList.add(win?'win':'lose');
    const bn=$('#bbanner');
    if(win){bn.innerHTML='<div class="bwin">\ud83c\udf89 KEMENANGAN!</div>';$('#bstatus').textContent='Dinding phalanx kita menolak musuh berundur!';confetti();SND.ding();}
    else{bn.innerHTML='<div class="blose">Musuh menang kali ini\u2026</div>';$('#bstatus').textContent='Barisan kita pecah dan musuh menembusi pertahanan.';SND.wrong();}
    bn.classList.add('go');
  },2600);
  setTimeout(done,4300);
}
/* show outcome panel after the battle animation */
function battleOutcome(win,correct,wrongList){
  if(win){
    if(!S.finalWin){S.finalWin=true;addScore(40);save();}
    mount(`<div class="misshd"><span class="misstag gold">Cabaran Akhir</span><h2 class="misstitle">\ud83c\udfc6 Keputusan Pertempuran</h2></div>
      <div class="stagebox outcome win">
        <div class="medimg">${A.medal(MEDALS.grand.col)}</div>
        <h2>\ud83c\udf89 Kemenangan Gemilang!</h2>
        ${speech('Hebat sungguh, panglima muda! Kesemua keputusan kamu tepat. Dengan memilih <b>laluan sempit</b>, formasi <b>phalanx</b>, lembing <b>dory</b> dan taktik bertahan rapat, tentera kecil kita berjaya mengalahkan musuh yang jauh lebih ramai! Inilah kebijaksanaan seorang panglima sejati.',true)}
        <div class="row"><button class="btn" id="toRes">Lihat Keputusan Akhir \u2192</button></div>
      </div>`,true);
    award('grand');
    $('#toRes').onclick=()=>route('results');
  }else{
    const tips=wrongList.map(d=>`<li>${d.fb}</li>`).join('');
    mount(`<div class="misshd"><span class="misstag gold">Cabaran Akhir</span><h2 class="misstitle">\u2694\ufe0f Keputusan Pertempuran</h2></div>
      <div class="stagebox outcome lose">
        <h2>Jangan putus asa, wira muda!</h2>
        ${speech('Pertempuran ini belum berjaya. Kamu betul <b>'+correct+'/4</b> keputusan. Panglima hebat belajar daripada kesilapan \u2014 baiki pilihan kamu dan cuba lagi! Jika kamu memilih untuk teruskan, kamu tetap tamat tetapi markah akan lebih rendah.',true)}
        <div class="tips"><p class="tipshd">\ud83d\udca1 Panduan untuk menang:</p><ul>${tips}</ul></div>
        <div class="row"><button class="btn" id="retry">\ud83d\udd04 Cuba Semula</button><button class="btn ghost" id="accept">Terima & Teruskan</button></div>
      </div>`,true);
    $('#retry').onclick=()=>warCouncil();
    $('#accept').onclick=()=>{award('grand');setTimeout(()=>route('results'),400);};
  }
}
/* ====================== RESULTS ====================== */
function rankOf(sc,medals){
  if(medals>=5&&sc>=360)return {name:'Wira Yunani',emo:'\ud83c\udfc6',col:'#FFD166',msg:'Luar biasa! Kamu ialah panglima Yunani sejati yang berani dan bijak!'};
  if(sc>=270)return {name:'Ahli Strategi Muda',emo:'\ud83e\udde0',col:'#FF956B',msg:'Hebat! Kamu berfikir seperti seorang panglima yang bijak.'};
  if(sc>=170)return {name:'Askar Bijak',emo:'\u2694\ufe0f',col:'#2878B5',msg:'Bagus sekali! Kamu seorang askar yang pandai dan gigih.'};
  return {name:'Penjelajah Yunani',emo:'\ud83e\udded',col:'#48C9B0',msg:'Syabas kerana menamatkan pengembaraan! Teruskan belajar, wira muda.'};
}
routes.results=function(){
  const medals=Object.keys(S.medals).filter(k=>S.medals[k]).length;
  const r=rankOf(S.score,medals);
  const medRow=Object.keys(MEDALS).map(k=>`<div class="rmed ${S.medals[k]?'':'off'}"><div class="rmimg">${S.medals[k]?A.medal(MEDALS[k].col):'<div class=\'jlock\'>\ud83d\udd12</div>'}</div><span>${MEDALS[k].name}</span></div>`).join('');
  confetti();
  mount(`<div class="results">
    <div class="rankcard" style="--rc:${r.col}"><div class="rankemo">${r.emo}</div><p class="ranklbl">Pangkat Kamu</p><h1 class="rankname">${r.name}</h1><div class="bigscore">${S.score} <span>mata</span></div></div>
    ${speech(r.msg,true)}
    <h3 class="rsec">Pingat Dikumpulkan (${medals}/5)</h3>
    <div class="rmedrow">${medRow}</div>
    <div class="reflect"><h3>\ud83d\udcad Renungan Wira</h3><p>Apakah perkara paling menarik yang kamu pelajari tentang pahlawan Yunani purba? Fikir sejenak \u2014 mungkin tentang phalanx yang kuat, atau strategi bijak di laluan sempit!</p>
      <div class="reflbtns"><button class="reflb">Formasi phalanx yang kuat</button><button class="reflb">Strategi memilih tempat</button><button class="reflb">Kelengkapan askar</button><button class="reflb">Mempertahankan kota</button></div>
      <div class="reflmsg" id="reflmsg"></div></div>
    <div class="row"><button class="btn" id="rMap">\ud83c\udfe0 Peta</button><button class="btn ghost" id="rJournal">\ud83d\udcd6 Jurnal</button><button class="btn warn" id="rReplay">\ud83d\udd04 Main Semula</button></div>
  </div>`,true);
  app.querySelectorAll('.reflb').forEach(b=>b.onclick=()=>{app.querySelectorAll('.reflb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('#reflmsg').innerHTML='<span class="ok">Pilihan yang bagus! \u201c'+b.textContent+'\u201d memang penting dalam dunia pahlawan Yunani. \ud83c\udf1f</span>';});
  $('#rMap').onclick=()=>route('map');
  $('#rJournal').onclick=()=>route('journal');
  $('#rReplay').onclick=()=>{if(confirm('Mula semula pengembaraan dari awal? Semua mata dan pingat akan direset.')){S=JSON.parse(JSON.stringify(DEF_STATE));save();route('opening');}};
};

/* ====================== BOOT ====================== */
if(!location.hash)location.hash='#opening';
render();
window.addEventListener('pointerdown',function onceStart(){SND.ensure();SND.resume();if(SND.on&&!SND.playing)SND.startMusic();window.removeEventListener('pointerdown',onceStart);});
/* global click sound on interactive elements */
document.addEventListener('click',function(e){
  const el=e.target.closest('button,a,.opt,.decopt,.item,.bin,.spot,.vcard,.mitem,.slot,.reflb,.chip,.tbtn,.medchip');
  if(el)SND.click();
},true);
/* end */
</script>
</body>
</html>
